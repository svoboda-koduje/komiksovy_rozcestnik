<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizuální komiksový rozcestník</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,400&family=Montserrat:wght@400;600;800&family=Neucha&family=Patrick+Hand&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
    <style>
        body {
            font-family: 'Neucha', cursive;
            font-size: 1.2rem;
            background-color: #f0f4f8;
            background-image: radial-gradient(#cbd5e0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        h1, h2, h3, .comic-font, .font-comic {
            font-family: 'Bangers', cursive;
            letter-spacing: 1px;
        }
        .tag-font {
    font-family: 'Patrick Hand', cursive;
    letter-spacing: 0.5px; /* Lehce zlepší čitelnost na mobilu */
}
        .filter-btn {
            border: 2px solid #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            background-color: #000;
            color: #fff;
            transform: scale(1.05);
        }
        .card-image-container {
            border: 3px solid #000;
            overflow: hidden;
            aspect-ratio: 1 / 1;
        }
        
        /* --- STYLY PRO LIGHTBOX (ZVĚTŠOVÁNÍ) --- */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
            animation: fadeIn 0.3s;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s;
        }
        .zoomable {
            cursor: zoom-in;
            transition: transform 0.2s;
        }
        .zoomable:hover {
            opacity: 0.9;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.9); } to { transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-[#f0f4f8]">
    <nav class="p-4 container mx-auto">
        <a href="index.html" class="filter-btn px-4 py-2 bg-white text-black border-2 border-black rounded-full inline-flex items-center gap-2">
    <span class="text-3xl leading-none pb-1">←</span>
    <span>Zpět na rozcestník</span>
</a>
    </nav>

    <main id="profile-container" class="container mx-auto px-4 py-8 max-w-4xl bg-white border-4 border-black shadow-[8px_8px_0px_rgba(0,0,0,1)] my-8">
    </main>
    
    <div id="lightbox">
        <img id="lightbox-img" src="" alt="Zvětšený obrázek">
    </div>
    <div id="backToTop" class="fixed bottom-20 right-8 z-50 cursor-pointer transition-all duration-300 transform translate-y-20 opacity-0" role="button" aria-label="Zpět nahoru">
    <svg width="60" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" 
         class="drop-shadow-[5px_5px_0px_rgba(0,0,0,1)]">
        <path d="M12 2L3 11H8V22H16V11H21L12 2Z" 
              class="fill-yellow-400 hover:fill-yellow-500 transition-colors duration-200 stroke-black stroke-[2.5]" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
    </svg>
</div>

    <script src="data.js"></script>
    <script>
        // 1. Získat ID z URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        // 2. Najít autora v datech
        const author = comicsData.find(item => item.id === id);

        // 3. Vykreslit obsah
        const container = document.getElementById('profile-container');
        
        if (author) {
            container.innerHTML = `
                <header class="mb-8 text-center border-b-4 border-black pb-6">
                    <h1 class="text-5xl md:text-7xl comic-font mb-4">${author.name}</h1>
                    <div class="flex justify-center gap-2 mb-4">
                        ${author.tags.map(tag => `<span class="tag-font bg-yellow-300 border-2 border-black px-3 py-1 font-bold text-sm transform rotate-[-2deg]">${tag}</span>`).join('')}
                    </div>
                </header>

                <div class="grid md:grid-cols-3 gap-8 mb-12">
                    <div class="md:col-span-1">
                        <div class="card-image-container rotate-2 border-4 border-black shadow-[5px_5px_0px_#000]">
                            <img src="images/${author.image}" class="zoomable w-full h-full object-cover" alt="${author.name}">
                        </div>
                        <a href="${author.url}" target="_blank" class="block mt-4 text-center bg-yellow-400 text-black py-3 font-bold hover:bg-yellow-300 transition">OSOBNÍ PORTFOLIO - klikni sem</a>
                    </div>
                    
                    <div class="md:col-span-2 font-sans text-lg leading-relaxed article-content">
                        <h2 class="text-3xl comic-font mb-4 border-l-8 border-yellow-400 pl-3">Bio</h2>
                        ${author.bio || author.desc}
                    </div>
                </div>
            `;
            
            // --- LOGIKA PRO LIGHTBOX (ZVĚTŠOVÁNÍ) ---
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            
            // Vybereme všechny obrázky s třídou "zoomable" (hlavní fotka + ty v textu)
            const images = document.querySelectorAll('.zoomable');
            
            images.forEach(img => {
                img.addEventListener('click', (e) => {
                    e.preventDefault(); // Zabrání prokliku, kdyby byl obrázek v odkazu
                    lightboxImg.src = img.src;
                    lightbox.style.display = 'flex';
                });
            });

            // Kliknutí na lightbox ho zavře
            lightbox.addEventListener('click', () => {
                lightbox.style.display = 'none';
            });

        } else {
            container.innerHTML = "<h1>Autor nenalezen</h1>";
        }
        
// --- Back to Top Logic ---
    const backToTopBtn = document.getElementById('backToTop');

    window.addEventListener('scroll', () => {
        // Zobrazí tlačítko, pokud sjedete o více než 300px dolů
        if (window.scrollY > 300) {
            backToTopBtn.classList.remove('opacity-0', 'invisible');
            backToTopBtn.classList.add('opacity-100', 'visible');
        } else {
            backToTopBtn.classList.add('opacity-0', 'invisible');
            backToTopBtn.classList.remove('opacity-100', 'visible');
        }
    });

    backToTopBtn.addEventListener('click', () => {
        window.scrollTo({
            top: 0,
            behavior: 'smooth' // Plynulé scrollování
        });
    });
    // --- End Back to Top Logic ---
    </script>
</body>
</html>
